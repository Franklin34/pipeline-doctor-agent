[project]
name = "pd-mcp-jira"
version = "0.0.0"
description = "Jira MCP server (search, create, comment)."
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "mcp==2.3.0",
    "pydantic==2.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pd_mcp_jira"]
