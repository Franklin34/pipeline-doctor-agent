name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:  # throwaway database for the pgvector tests (no real data, test-only credentials)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: pdtest
          POSTGRES_DB: pdtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pdtest" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PD_TEST_DATABASE_URL: postgresql://postgres:pdtest@localhost:5432/pdtest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7  # agent tests build the Go Jenkins MCP server
        with:
          go-version-file: services/ingress/go.mod
      - run: uv sync --all-packages --locked
      # The sandbox tests prove isolation against real Docker; they also fetch one wheel (pytest) from PyPI.
      - run: docker pull python:3.13-slim
      # Terraform: formatting and provider-schema validation. No credentials, no state, nothing is applied.
      - run: >
          docker run --rm -v "$PWD/deploy/terraform:/tf" -w /tf hashicorp/terraform:1.17.2
          fmt -check -recursive
      - run: >
          docker run --rm -v "$PWD/deploy/terraform:/tf" -w /tf hashicorp/terraform:1.17.2
          init -backend=false -input=false
      - run: >
          docker run --rm -v "$PWD/deploy/terraform:/tf" -w /tf hashicorp/terraform:1.17.2
          validate
      # Alert rules and config are checked by Prometheus' own tool, not just by our unit tests.
      - run: >
          docker run --rm --entrypoint promtool
          -v "$PWD/deploy/observability:/obs:ro" prom/prometheus:v3.16.0
          check rules /obs/alerts.yml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: make typecheck
      - run: make test
      # Golden dataset with the scripted model: fails on any safety miss or quality regression.
      - run: make eval

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: services/ingress/go.mod
      - run: make lint
      - run: make test-go

  # Not yet in CI (each needs more time or credentials than a PR check should spend):
  #   container image build + vulnerability scan
  #   the Pub/Sub emulator tests (a 1.5 GB image) and the live-GitHub checks
