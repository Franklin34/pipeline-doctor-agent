global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ingress
    static_configs:
      - targets: ["ingress:8080"]
  # The worker runs on the host during development (uv run python -m pipeline_doctor_agent.worker);
  # set METRICS_ADDR=0.0.0.0 so the container can reach it through host.docker.internal.
  - job_name: pipeline-doctor-worker
    static_configs:
      - targets: ["host.docker.internal:9102"]
