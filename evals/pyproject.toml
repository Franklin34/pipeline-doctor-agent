[project]
name = "pd-evals"
version = "0.0.0"
description = "Golden dataset and evaluation runner."
requires-python = ">=3.13"
dependencies = [
    "pipeline-doctor-agent",
    "pydantic==2.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pd_evals"]

[tool.uv.sources]
pipeline-doctor-agent = { workspace = true }
